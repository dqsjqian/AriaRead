name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ariaread-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vs2026:
    name: Build and regressions (VS2026 MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      # OpenSSL 的 MSVC 构建走 nmake + cl（ExternalProject），
      # configure 期 find_program(nmake REQUIRED) 与 build 期 nmake 执行
      # 都要求 VS 开发者环境在 PATH 里。
      - uses: ilammy/msvc-dev-cmd@v1
      # 统一 web 回归的 Python 版本（镜像预装 3.12，与 matrix job 的 3.13 对齐，
      # 避免测试代码在本机/CI 不同 minor 间行为漂移）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # 依赖的唯一来源：固定版本 + SHA256，由脚本显式构建到 build/deps/prefix。
      # Continuo 仓库目前是私有的，抓取需要能读它的 token（仓库 secret）。
      - name: Build pinned dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.CONTINUO_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python tools/ci/build_ariaread_deps.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure tests
        run: |
          cmake -S . -B build/ci-vs2026 -G "Visual Studio 18 2026" -A x64 -DARIAREAD_BUILD_TESTS=ON -DARIAREAD_BUILD_WEB_TESTS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build engine, ViewModels and Web server
        run: |
          cmake --build build/ci-vs2026 --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Dump test-binary DLL dependencies on failure
        if: failure()
        run: |
          dumpbin /DEPENDENTS build\ci-vs2026\bin\Release\ariaread-tests.exe
          dumpbin /DEPENDENTS build\ci-vs2026\bin\Release\ariaread_web_server.exe
      - name: Run engine, ViewModel and Web regressions
        # 这里曾经是阻塞门禁的例外：MSVC 侧的静态 CRT 与共享 Aria DLL 不匹配
        # （/MT 下每个模块各自一个 CRT 堆，跨模块释放堆内存即 0xc0000374 堆损坏），
        # 169 个用例里挂 114 个。改用动态 CRT（/MD）后病灶消除，本机与 CI
        # 都稳定 169/169，故恢复为阻塞门禁。
        run: |
          $env:PATH = "$PWD\build\ci-vs2026\bin\Release;$env:PATH"
          ctest --test-dir build/ci-vs2026 -C Release --output-on-failure --no-tests=error --parallel 3 --timeout 120
      - name: Web server smoke test
        run: |
          ./build/ci-vs2026/bin/Release/ariaread_web_server.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload build and test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ariaread-diagnostics-vs2026
          path: |
            build/ci-vs2026/CMakeCache.txt
            build/ci-vs2026/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-vs2026/Testing/Temporary/
          if-no-files-found: ignore

  windows:
    name: Build and regressions (Windows UCRT64)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-nodejs
      - name: Build pinned dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.CONTINUO_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/ci/build_ariaread_deps.py
      - name: Configure tests
        run: |
          cmake -S . -B build/ci-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DARIAREAD_BUILD_TESTS=ON -DARIAREAD_BUILD_WEB_TESTS=ON
      - name: Build engine, ViewModels and Web server
        run: cmake --build build/ci-win --parallel 3
      - name: Dump test-binary DLL dependencies on failure
        if: failure()
        run: |
          objdump -p build/ci-win/bin/ariaread-tests.exe | grep -i "DLL Name"
          objdump -p build/ci-win/bin/ariaread_web_server.exe | grep -i "DLL Name"
      - name: Run engine, ViewModel and Web regressions
        run: |
          export PATH="$PWD/build/ci-win/bin:$PATH"
          ctest --test-dir build/ci-win --output-on-failure --no-tests=error --parallel 3 --timeout 120
          ./build/ci-win/bin/ariaread_web_server.exe --help
      - name: Upload build and test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ariaread-diagnostics-windows
          path: |
            build/ci-win/CMakeCache.txt
            build/ci-win/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-win/Testing/Temporary/
          if-no-files-found: ignore

  build-and-test:
    name: Build and regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 perl make zlib1g-dev
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build pinned dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.CONTINUO_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 tools/ci/build_ariaread_deps.py
      - name: Configure tests
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIAREAD_BUILD_TESTS=ON \
            -DARIAREAD_BUILD_WEB_TESTS=ON

      - name: Build engine, ViewModels and Web server
        run: cmake --build build/ci --parallel 3

      - name: Run engine, ViewModel and Web regressions
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error --parallel 3 --timeout 120

      - name: Verify Web runtime layout and dynamic libraries
        run: ARIAREAD_BUILD_DIR="$PWD/build/ci" bash scripts/build_web_release.sh --skip-cmake

      - name: Upload build and test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ariaread-diagnostics-${{ matrix.os }}
          path: |
            build/ci/CMakeCache.txt
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/Testing/Temporary/
            build/deps/prefix/share/ariaread-deps/manifest.json
          if-no-files-found: ignore
