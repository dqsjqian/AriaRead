name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openread-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vs2026:
    name: Build and regressions (VS2026 MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      # OpenSSL 的 MSVC 构建走 nmake + cl（ExternalProject），
      # configure 期 find_program(nmake REQUIRED) 与 build 期 nmake 执行
      # 都要求 VS 开发者环境在 PATH 里。
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure bundled dependencies and tests
        run: |
          cmake -S . -B build/ci-vs2026 -G "Visual Studio 18 2026" -A x64 -DOPENREAD_BUILD_TESTS=ON -DOPENREAD_BUILD_WEB_TESTS=ON -DOPENREAD_ENFORCE_SELF_CONTAINED=ON -DOPENREAD_USE_SYSTEM_CURL=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build engine, ViewModels and Web server
        run: |
          cmake --build build/ci-vs2026 --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run engine, ViewModel and Web regressions
        run: |
          $env:PATH = "$PWD\build\ci-vs2026\bin\Release;$env:PATH"
          ctest --test-dir build/ci-vs2026 -C Release --output-on-failure --no-tests=error --parallel 3 --timeout 120
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/ci-vs2026/bin/Release/openread_web_server.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload build and test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openread-diagnostics-vs2026
          path: |
            build/ci-vs2026/CMakeCache.txt
            build/ci-vs2026/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-vs2026/Testing/Temporary/
            build/ci-vs2026/openssl_external-prefix/src/openssl_external-stamp/*.log
          if-no-files-found: ignore

  windows:
    name: Build and regressions (Windows UCRT64)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-nodejs
      - name: Configure bundled dependencies and tests
        run: |
          cmake -S . -B build/ci-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOPENREAD_BUILD_TESTS=ON -DOPENREAD_BUILD_WEB_TESTS=ON \
            -DOPENREAD_ENFORCE_SELF_CONTAINED=ON -DOPENREAD_USE_SYSTEM_CURL=OFF
      - name: Build engine, ViewModels and Web server
        run: cmake --build build/ci-win --parallel 3
      - name: Run engine, ViewModel and Web regressions
        run: |
          export PATH="$PWD/build/ci-win/bin:$PATH"
          ctest --test-dir build/ci-win --output-on-failure --no-tests=error --parallel 3 --timeout 120
          ./build/ci-win/bin/openread_web_server.exe --help
      - name: Upload build and test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openread-diagnostics-windows
          path: |
            build/ci-win/CMakeCache.txt
            build/ci-win/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-win/Testing/Temporary/
            build/ci-win/openssl_external-prefix/src/openssl_external-stamp/*.log
          if-no-files-found: ignore

  build-and-test:
    name: Build and regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 perl make zlib1g-dev
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure bundled dependencies and tests
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENREAD_BUILD_TESTS=ON \
            -DOPENREAD_BUILD_WEB_TESTS=ON \
            -DOPENREAD_ENFORCE_SELF_CONTAINED=ON \
            -DOPENREAD_USE_SYSTEM_CURL=OFF

      - name: Build engine, ViewModels and Web server
        run: cmake --build build/ci --parallel 3

      - name: Run engine, ViewModel and Web regressions
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error --parallel 3 --timeout 120

      - name: Verify Web runtime layout and dynamic libraries
        run: OPENREAD_BUILD_DIR="$PWD/build/ci" bash scripts/build_web_release.sh --skip-cmake

      - name: Upload build and test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openread-diagnostics-${{ matrix.os }}
          path: |
            build/ci/CMakeCache.txt
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/Testing/Temporary/
            build/ci/openssl_external-prefix/src/openssl_external-stamp/*.log
          if-no-files-found: ignore
