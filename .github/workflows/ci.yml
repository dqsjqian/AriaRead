name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ariaread-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-contracts:
    name: Dependency contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install aria-deps
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Verify build, source and cache contracts
        run: python scripts/build.py test-tools

  vs2026:
    name: Build and regressions (VS2026 MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install aria-deps
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify compiler and SDK
        id: toolchain
        run: python scripts/build.py cache-key >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: |
            build/deps/cache
            deps
            build/deps/windows-msvc/prefix
          key: deps-msvc-${{ steps.toolchain.outputs.key }}-${{ hashFiles('dependencies.json', 'scripts/build.py', 'scripts/_recipes/*.py', 'scripts/_recipes/*', 'requirements-build.txt') }}
          restore-keys: deps-msvc-${{ steps.toolchain.outputs.key }}-
      # The default Schannel backend needs neither OpenSSL nor Perl/MSYS2.
      - name: Build, package and run all regressions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --toolchain msvc --generator "Visual Studio 18 2026" --build-dir build/ci-vs2026 --test --require-web-tests --jobs 3
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ariaread-diagnostics-vs2026
          path: |
            build/ci-vs2026/CMakeCache.txt
            build/ci-vs2026/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-vs2026/Testing/Temporary/
            build/deps/windows-msvc/prefix/share/ariaread-deps/manifest.json
          if-no-files-found: ignore

  windows:
    name: Build and regressions (Windows UCRT64)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-nodejs
      - name: Install aria-deps (msys2 python)
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - name: Identify compiler and SDK
        id: toolchain
        run: python scripts/build.py cache-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            build/deps/cache
            deps
            build/deps/windows-mingw/prefix
          key: deps-mingw-${{ steps.toolchain.outputs.key }}-${{ hashFiles('dependencies.json', 'scripts/build.py', 'scripts/_recipes/*.py', 'scripts/_recipes/*', 'requirements-build.txt') }}
          restore-keys: deps-mingw-${{ steps.toolchain.outputs.key }}-
      - name: Build, package and run all regressions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --toolchain mingw --generator Ninja --build-dir build/ci-win --test --require-web-tests --jobs 3
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ariaread-diagnostics-windows
          path: |
            build/ci-win/CMakeCache.txt
            build/ci-win/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-win/Testing/Temporary/
            build/deps/windows-mingw/prefix/share/ariaread-deps/manifest.json
          if-no-files-found: ignore

  gcc-current:
    name: Build and regressions (Linux GCC 16.2, C++23)
    runs-on: ubuntu-24.04
    container: gcc:16.2.0-trixie
    timeout-minutes: 45
    env:
      CC: gcc
      CXX: g++
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and regression tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build python3 python3-pip nodejs ca-certificates
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install aria-deps
        run: python3 -m pip install --break-system-packages -r requirements-build.txt
      - name: Identify compiler and SDK
        id: toolchain
        run: python3 scripts/build.py cache-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            build/deps/cache
            deps
            build/deps/prefix
          key: deps-linux-gcc16-${{ steps.toolchain.outputs.key }}-${{ hashFiles('dependencies.json', 'scripts/build.py', 'scripts/_recipes/*.py', 'scripts/_recipes/*', 'requirements-build.txt') }}
          restore-keys: deps-linux-gcc16-${{ steps.toolchain.outputs.key }}-
      - name: Build, package and run all regressions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py --generator Ninja --build-dir build/ci-gcc16 --test --require-web-tests --jobs 3
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ariaread-diagnostics-linux-gcc16
          path: |
            build/ci-gcc16/CMakeCache.txt
            build/ci-gcc16/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-gcc16/Testing/Temporary/
            build/deps/prefix/share/ariaread-deps/manifest.json
          if-no-files-found: ignore

  build-and-test:
    name: Build and regressions (macOS, Xcode 27)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-26 currently stops at Xcode 26.6. This image includes the
        # stable Xcode 27.0; keep setup-xcode pinned rather than using a beta.
        os: [xcode-27]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install aria-deps
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Identify compiler and SDK
        id: toolchain
        run: python3 scripts/build.py cache-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            build/deps/cache
            deps
            build/deps/prefix
          key: deps-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('dependencies.json', 'scripts/build.py', 'scripts/_recipes/*.py', 'scripts/_recipes/*', 'requirements-build.txt') }}
          restore-keys: deps-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-
      - name: Build, package and run all regressions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py --generator Ninja --build-dir build/ci --test --require-web-tests --jobs 3
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ariaread-diagnostics-${{ matrix.os }}
          path: |
            build/ci/CMakeCache.txt
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/Testing/Temporary/
            build/deps/prefix/share/ariaread-deps/manifest.json
          if-no-files-found: ignore
